<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0f">
<title>SeatSight</title>
<meta name="description" content="Pick a movie and a seat, then see the screen from that seat in 3D before you book.">
<style>
  :root {
    --bg: #0a0b0f; --surface: #14161c; --surface-2: #1c1f27; --line: #ffffff12; --text: #f3f4f8; --dim: #8d93a3;
    --open: #26beaa; --taken: #2c2f38; --pick: #ff5c7a; --great: #26beaa; --good: #7fd6c8; --okay: #f5b94a; --poor: #ff6b6b;
    --r: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { background: radial-gradient(1200px 500px at 50% -200px, #1d2233 0%, transparent 70%), var(--bg); min-height: 100vh; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  [hidden] { display: none !important; }
  svg { width: 20px; height: 20px; flex: none; }

  .bar { position: sticky; top: 0; z-index: 5; backdrop-filter: saturate(160%) blur(18px); background: #0a0b0fcc; border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 960px; margin: auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; min-height: 60px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); flex: none; }
  .title { min-width: 0; }
  .title b { display: block; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title span { color: var(--dim); font-size: 13px; }
  .title .brand { font-weight: 800; font-size: 21px; letter-spacing: -0.03em; color: var(--text); }
  .brand i { font-style: normal; color: var(--pick); }
  .place { margin-left: auto; position: relative; }
  .place select { appearance: none; background: var(--surface-2); border: 0; border-radius: 999px; padding: 9px 34px 9px 14px; font-size: 14px; }
  .place::after { content: ""; position: absolute; right: 14px; top: 50%; width: 6px; height: 6px; border: solid var(--dim); border-width: 0 2px 2px 0; transform: translateY(-70%) rotate(45deg); pointer-events: none; }

  main { max-width: 960px; margin: auto; padding: 20px 16px 140px; }
  h1 { font-size: 28px; letter-spacing: -0.03em; margin: 4px 0 18px; }
  .dim { color: var(--dim); }

  .movies { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 16px; }
  .movie { text-align: left; }
  .poster { aspect-ratio: 2 / 3; border-radius: var(--r); position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 14px; font-weight: 800; font-size: 21px; line-height: 1.02; letter-spacing: -0.02em; box-shadow: 0 10px 30px -12px #000; transition: transform .2s; }
  .poster::before { content: ""; position: absolute; width: 75%; aspect-ratio: 1; border-radius: 50%; right: -18%; top: 10%; background: var(--c1); opacity: .9; }
  .poster::after { content: ""; position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, #000d); }
  .poster b { position: relative; z-index: 1; }
  .movie:hover .poster { transform: translateY(-3px); }
  .movie .meta { color: var(--dim); font-size: 13px; margin-top: 8px; }

  .hero { display: flex; gap: 16px; align-items: center; margin-bottom: 22px; }
  .hero .poster { width: 84px; font-size: 11px; padding: 8px; border-radius: 12px; flex: none; }
  .hero h1 { margin: 0 0 4px; font-size: 24px; }
  .days { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 22px; padding: 0 16px 4px; scrollbar-width: none; }
  .days button { flex: none; background: var(--surface); border-radius: 14px; padding: 10px 14px; min-width: 66px; text-align: center; font-size: 13px; color: var(--dim); }
  .days button b { display: block; font-size: 17px; color: var(--text); }
  .days button[aria-pressed="true"] { background: var(--text); color: #0a0b0f; }
  .days button[aria-pressed="true"] b { color: #0a0b0f; }
  .fmt { background: var(--surface); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
  .fmt h3 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
  .fmt p { margin: 2px 0 14px; color: var(--dim); font-size: 13px; }
  .times { display: flex; gap: 8px; flex-wrap: wrap; }
  .times button { background: var(--surface-2); border-radius: 12px; padding: 10px 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .times button:hover { background: #262a35; }

  .tools { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .pill { background: var(--surface); border-radius: 999px; padding: 9px 14px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
  .pill[aria-pressed="true"] { background: var(--text); color: #0a0b0f; }
  .map { background: var(--surface); border-radius: 24px; padding: 22px 10px 18px; overflow-x: auto; }
  .grid { width: max-content; margin: 0 auto; padding: 0 6px; }
  .screen { position: relative; height: 34px; margin: 0 auto 30px; width: 78%; }
  .screen::before { content: ""; position: absolute; inset: 0; border-top: 3px solid #e8ecff; border-radius: 50% 50% 0 0 / 100% 100% 0 0; filter: drop-shadow(0 -6px 14px #9fb2ff99); }
  .screen span { position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-size: 11px; letter-spacing: .3em; color: var(--dim); }
  .row { display: flex; justify-content: center; align-items: center; gap: 3px; margin-bottom: 4px; }
  .row b { width: 16px; font-size: 10px; color: #5c6273; text-align: center; font-weight: 600; }
  .gap { width: calc(var(--s) * 1.2); }
  .seat { width: var(--s); height: var(--s); border-radius: 7px 7px 4px 4px; background: var(--open); transition: transform .12s, opacity .2s; }
  .seat:hover { transform: scale(1.15); }
  .seat.taken { background: var(--taken); cursor: not-allowed; transform: none; }
  .seat.mine { background: var(--pick); box-shadow: 0 0 0 3px #ff5c7a44; }
  .map.best .seat:not(.top):not(.taken):not(.mine) { opacity: .28; }
  .legend { display: flex; justify-content: center; gap: 16px; margin-top: 18px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 4px 4px 2px 2px; margin-right: 6px; vertical-align: -1px; }
  .note { color: #5c6273; font-size: 12px; margin-top: 18px; }
  .note a { color: inherit; }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, #0a0b0f 30%); }
  .dock-in { max-width: 560px; margin: auto; background: var(--surface-2); border-radius: 22px; padding: 12px 12px 12px 18px; display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 40px -10px #000; border: 1px solid var(--line); }
  .dock .what { min-width: 0; }
  .dock .what b { display: block; }
  .dock .what span { font-size: 13px; }
  .cta { margin-left: auto; background: var(--pick); color: #fff; border-radius: 14px; padding: 12px 18px; font-weight: 700; white-space: nowrap; }
  .cta:disabled { background: var(--surface); color: var(--dim); cursor: default; }
  .verdict { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #ffffff10; }
  .great { color: var(--great); } .good { color: var(--good); } .okay { color: var(--okay); } .poor { color: var(--poor); }

  #view { position: fixed; inset: 0; z-index: 10; background: #06070a; display: none; touch-action: none; }
  #view.open { display: block; }
  #view canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  .vbar { position: absolute; left: 0; right: 0; top: 0; padding: calc(12px + env(safe-area-inset-top)) 14px 12px; display: flex; align-items: center; gap: 8px; background: linear-gradient(#06070acc, transparent); }
  .vbar .icon-btn { background: #ffffff1a; backdrop-filter: blur(12px); }
  .seg { margin: 0 auto; display: flex; background: #ffffff1a; backdrop-filter: blur(12px); border-radius: 999px; padding: 3px; }
  .seg button { white-space: nowrap; padding: 7px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; color: #ffffffb0; }
  .seg button[aria-pressed="true"] { background: #fff; color: #0a0b0f; }
  .sheet { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 400px; background: #14161ce6; backdrop-filter: blur(20px) saturate(160%); border: 1px solid var(--line); border-radius: 24px; padding: 18px; box-shadow: 0 20px 60px -20px #000; }
  .sheet .top { display: flex; align-items: flex-start; gap: 10px; }
  .sheet .top b { font-size: 20px; letter-spacing: -0.02em; display: block; }
  .sheet .top span { font-size: 13px; }
  .sheet .verdict { margin-left: auto; font-size: 13px; padding: 5px 11px; }
  .facts { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
  .facts li { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }
  .facts .ico { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: #ffffff0d; color: var(--great); flex: none; }
  .facts .ico svg { width: 17px; height: 17px; }
  .facts li.warn .ico { color: var(--okay); }
  .facts small { display: block; color: var(--dim); font-size: 12px; }
  .est { font-size: 11px; color: #6b7182; margin: 12px 0 14px; }
  .sheet .cta { width: 100%; margin: 0; }
  #view.room .facts, #view.room .est, .sheet.mini .facts, .sheet.mini .est { display: none; }
  .more { font-size: 13px; color: var(--dim); margin: 10px 0 12px; display: flex; gap: 6px; align-items: center; }
  .sheet:not(.mini) .more, #view.room .more { display: none; }
  .hint { position: absolute; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%); background: #000a; backdrop-filter: blur(10px); padding: 8px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; pointer-events: none; transition: opacity .4s; }
  .toast { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); background: #000c; padding: 10px 16px; border-radius: 12px; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  #compare { position: absolute; inset: 0; display: none; background: #000; padding-top: calc(64px + env(safe-area-inset-top)); gap: 2px; grid-template-columns: 1fr 1fr; }
  #compare.open { display: grid; grid-auto-rows: 1fr; }
  #view.cmp .sheet, #view.cmp .seg, #view.cmp .hint { display: none; }
  #compare figure { position: relative; margin: 0; }
  #compare figcaption { position: absolute; left: 10px; bottom: 10px; background: #000b; backdrop-filter: blur(8px); padding: 6px 10px; border-radius: 10px; font-size: 13px; }
  #compare figcaption b { margin-right: 6px; }
  @media (max-width: 640px) {
    .sheet { max-width: none; padding: 16px; }
    .facts { gap: 8px; }
    .facts li { font-size: 13px; }
    #compare { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <button class="icon-btn" id="back" aria-label="Back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="title" id="title"><span class="brand">Seat<i>Sight</i></span></div>
  <label class="place" id="place"><select id="theatre" aria-label="Theatre"></select></label>
</div></div>

<main>
  <section id="p-movies">
    <h1>Now playing</h1>
    <div class="movies" id="movies"></div>
  </section>

  <section id="p-times" hidden>
    <div class="hero" id="hero"></div>
    <div class="days" id="days"></div>
    <div id="formats"></div>
  </section>

  <section id="p-seats" hidden>
    <div class="tools">
      <button class="pill" id="bestOn" aria-pressed="false">Show best seats</button>
      <button class="pill" id="pickBest">Pick the best seat for me</button>
    </div>
    <div class="map" id="map"></div>
  </section>

  <p class="note">Demo with made-up movies, theatres and sold seats. Room sizes are typical, not measured. Not affiliated with any cinema chain. <a href="https://github.com/alireza12t/seatsight">Open source</a></p>
</main>

<div class="dock" id="dock" hidden><div class="dock-in">
  <div class="what" id="what"></div>
  <button class="cta" id="preview">View from seat</button>
</div></div>

<div id="view" role="dialog" aria-modal="true" aria-label="View from your seat">
  <canvas id="c"></canvas>
  <div id="compare"></div>
  <div class="vbar">
    <button class="icon-btn" id="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="seg" role="group" aria-label="View mode">
      <button id="mYou" aria-pressed="true">My view</button>
      <button id="mRoom" aria-pressed="false">Room</button>
    </div>
    <button class="icon-btn" id="cmp" aria-label="Compare screen types"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></button>
    <button class="icon-btn" id="share" aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 002 2h10a2 2 0 002-2v-5"/></svg></button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>
<script src="engine.js?v=1.2.5"></script>
<script src="app.js?v=1.2.5"></script>
</body>
</html>
