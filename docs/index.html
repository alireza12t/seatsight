<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SeatSight</title>
<meta name="description" content="Pick a movie, a screen type and a seat, then see the screen from that seat in 3D.">
<style>
  :root {
    --bg: #0b0c11; --panel: #14161e; --panel2: #1b1e29; --line: #262a36; --text: #eceef4; --dim: #9aa0b1;
    --accent: #ffc43c; --seat: #3a4157; --sold: #1c1f28;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .top { position: sticky; top: 0; z-index: 5; background: #0b0c11ee; backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 980px; margin: auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  h1 { margin: 0; font-size: 21px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .top select { margin-left: auto; }
  select, .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  main { max-width: 980px; margin: auto; padding: 12px 16px 120px; }
  .steps { display: flex; gap: 6px; font-size: 13px; color: var(--dim); margin: 4px 0 14px; flex-wrap: wrap; }
  .steps button { background: none; border: 0; padding: 0; color: var(--dim); }
  .steps .on { color: var(--text); font-weight: 600; }
  h2 { font-size: 20px; margin: 0 0 12px; }

  .movies { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .movie { background: none; border: 0; padding: 0; text-align: left; }
  .poster { aspect-ratio: 2 / 3; border-radius: 12px; position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 12px; font-weight: 800; font-size: 20px; line-height: 1.05; letter-spacing: -0.01em; text-shadow: 0 2px 12px #0008; }
  .poster::before { content: ""; position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%; right: -15%; top: 12%; background: var(--c1); opacity: 0.85; }
  .poster::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background: linear-gradient(transparent, #000c); }
  .poster b { position: relative; z-index: 1; }
  .tag { position: absolute; top: 10px; left: 10px; z-index: 1; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; background: #000a; padding: 3px 6px; border-radius: 6px; }
  .movie .meta { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .movie:hover .poster, .movie:focus-visible .poster { outline: 2px solid var(--accent); outline-offset: 2px; }

  .head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .head .poster { width: 64px; flex: none; font-size: 10px; padding: 6px; border-radius: 8px; }
  .head .poster .tag { display: none; }
  .head h2 { margin: 0; }
  .head p { margin: 2px 0 0; color: var(--dim); font-size: 13px; }
  .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
  .days button { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 72px; }
  .days button[aria-pressed="true"] { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  .fmt { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .fmt h3 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .fmt h3 small { color: var(--dim); font-weight: 400; font-size: 13px; }
  .fmt .why { color: var(--dim); font-size: 13px; margin: 4px 0 10px; }
  .times { display: flex; gap: 8px; flex-wrap: wrap; }
  .times button { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
  .times button:hover { border-color: var(--accent); }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
  #best { margin-left: auto; }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; }
  summary { cursor: pointer; color: var(--dim); }
  details label { display: grid; grid-template-columns: 140px 1fr 56px; gap: 8px; align-items: center; margin: 8px 0; font-size: 14px; }
  .map { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 8px 20px; overflow-x: auto; }
  .screen { height: 26px; margin: 0 auto 26px; border-top: 4px solid #cfd6ff; border-radius: 50% 50% 0 0 / 100% 100% 0 0; box-shadow: 0 -12px 30px -10px #8fa0ff88; text-align: center; color: var(--dim); font-size: 12px; padding-top: 8px; }
  .row { display: flex; justify-content: center; align-items: center; gap: 2px; margin: 0 auto 3px; }
  .row b { width: 18px; font-size: 11px; color: var(--dim); text-align: center; font-weight: 500; }
  .aisle { width: calc(var(--s) * 1.4); }
  .seat { width: var(--s); height: var(--s); border-radius: 4px 4px 6px 6px; border: 0; background: var(--seat); padding: 0; }
  .seat:hover, .seat:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .seat.sold { background: var(--sold); cursor: not-allowed; background-image: linear-gradient(45deg, transparent 44%, #3a3d48 44% 56%, transparent 56%); }
  .seat.best { box-shadow: inset 0 0 0 2px var(--accent); }
  .seat.sel { background: var(--accent) !important; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; color: var(--dim); font-size: 12px; margin-top: 14px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
  .foot { color: var(--dim); font-size: 12px; margin-top: 16px; }
  .foot a { color: var(--dim); }
  .tray { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: #14161ef2; backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .tray-in { max-width: 980px; margin: auto; display: flex; align-items: center; gap: 12px; }
  .tray .sum { font-size: 13px; color: var(--dim); }
  .tray .sum b { color: var(--text); font-size: 15px; }
  .cta { margin-left: auto; background: var(--accent); color: #111; border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; }

  #view { position: fixed; inset: 0; z-index: 10; background: #07080c; display: none; touch-action: none; }
  #view.open { display: block; }
  #view canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  .hud { position: absolute; left: 12px; top: 12px; max-width: min(360px, calc(100% - 24px)); background: #0b0c11cc; backdrop-filter: blur(8px); border: 1px solid #ffffff1a; border-radius: 14px; padding: 12px 14px; }
  .hud h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; }
  .score { margin-left: auto; font-size: 22px; font-weight: 700; }
  .hud .sub { color: var(--dim); font-size: 13px; }
  .hud dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 10px 0 6px; font-size: 13px; }
  .hud dt { color: var(--dim); }
  .hud dd { margin: 0; }
  .hud ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  .tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .tools button, .nav button { background: #0b0c11cc; border: 1px solid #ffffff22; border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(8px); }
  .tools button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .nav { position: absolute; right: 12px; bottom: 16px; display: grid; grid-template-columns: repeat(3, 44px); gap: 6px; }
  .nav button { padding: 8px 0; }
  .hint { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; color: #ffffff88; font-size: 12px; pointer-events: none; }
  .toast { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000c; padding: 10px 14px; border-radius: 10px; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  #compare { position: absolute; inset: 0; display: none; background: #000; padding-top: 60px; gap: 2px; grid-template-columns: 1fr 1fr; }
  #compare.open { display: grid; grid-auto-rows: 1fr; }
  #view.cmp .hud, #view.cmp .nav, #view.cmp .hint { display: none; }
  #view.ov .hud dl, #view.ov .hud ul { display: none; }
  #compare figure { position: relative; margin: 0; }
  #compare canvas { cursor: default; }
  #compare figcaption { position: absolute; left: 8px; top: 8px; background: #000a; padding: 4px 8px; border-radius: 8px; font-size: 13px; }
  @media (max-width: 640px) {
    .hud dl, .hud ul { font-size: 12px; }
    .hud { top: 60px; }
    .hint { bottom: 120px; }
    #compare { grid-template-columns: 1fr; }
    details label { grid-template-columns: 1fr 1fr 48px; }
  }
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <h1>Seat<span>Sight</span></h1>
  <select id="theatre" aria-label="Theatre"></select>
</div></div>
<main>
  <nav class="steps" id="steps"></nav>
  <section id="s-movies">
    <h2>Now playing</h2>
    <div class="movies" id="movies"></div>
  </section>
  <section id="s-times" hidden>
    <div class="head" id="mhead"></div>
    <div class="days" id="days"></div>
    <div id="formats"></div>
  </section>
  <section id="s-seats" hidden>
    <div class="head" id="shead"></div>
    <div class="bar">
      <button class="chip" id="heat" aria-pressed="false">Best seats</button>
      <button class="chip" id="crowd" aria-pressed="false">Crowd</button>
      <button class="chip" id="best"></button>
    </div>
    <details id="tweak">
      <summary>Adjust this room to match your theatre</summary>
      <label>Screen width <input type="range" id="tw" min="6" max="30" step="0.5"><span></span></label>
      <label>First row distance <input type="range" id="tf" min="2" max="10" step="0.25"><span></span></label>
      <label>Rake (step per row) <input type="range" id="tk" min="0.1" max="0.8" step="0.05"><span></span></label>
    </details>
    <div class="map" id="map"></div>
  </section>
  <p class="foot">Movies, theatres, showtimes and sold seats are made up. Room sizes are typical values, not measured plans. Not affiliated with any cinema chain. <a href="https://github.com/alireza12t/seatsight">Source on GitHub</a></p>
</main>

<div class="tray" id="tray" hidden><div class="tray-in">
  <div class="sum" id="sum"></div>
  <button class="cta" id="see">See the view</button>
</div></div>

<div id="view" aria-modal="true" role="dialog">
  <canvas id="c"></canvas>
  <div id="compare"></div>
  <div class="hud" id="hud"></div>
  <div class="tools">
    <button id="ov" aria-pressed="false">Room view</button>
    <button id="cmp">Compare</button>
    <button id="share">Share</button>
    <button id="close" aria-label="Back to seat map">✕</button>
  </div>
  <div class="nav" id="nav">
    <span></span><button data-d="0,-1" aria-label="Row forward">▲</button><span></span>
    <button data-d="-1,0" aria-label="Seat left">◀</button><button data-d="0,1" aria-label="Row back">▼</button><button data-d="1,0" aria-label="Seat right">▶</button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="toast" id="toast"></div>
</div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
